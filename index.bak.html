<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#081827" />
    <meta name="description" content="行きたい未来と、今の自分から始めやすいキャリアルートを確認するミニゲームです。" />
    <meta name="author" content="@satomi.ohtagaki" />
    <meta name="copyright" content="© 2026 @satomi.ohtagaki" />
    <title>Career Quest | はじめのルートを探そう</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="game-bar">
        <span class="game-brand">CAREER QUEST</span>
        <span id="stepLabel" class="step-label" aria-live="polite">START</span>
        <nav id="gameNav" class="game-nav" aria-label="ページ操作" hidden>
          <button type="button" data-global-action="back" aria-label="一つ前に戻る">← 戻る</button>
          <button type="button" data-global-action="top" aria-label="トップへ戻る">TOP</button>
        </nav>
      </header>

      <section id="screen" class="screen" aria-live="polite"></section>
    </main>

    <template id="startTemplate">
      <article class="start-screen">
        <img class="start-art" src="assets/hero.webp" alt="複数の未来の扉を前にした冒険者" />
        <div class="start-action">
          <p>
            世の中には、まだ知らない仕事がたくさんある。<br />
            今すぐ開ける扉もあれば、<br />
            <strong>経験やスキルという装備</strong>を集めて開く扉もある。<br />
            今の自分から、未来へ続くルートを探そう。
          </p>
          <button class="quest-button" data-action="start-quest">キャリアクエストを始める <span>→</span></button>
        </div>

        <section id="careerReveal" class="career-reveal" hidden aria-label="仕事のカードが未来の扉へ集まる演出">
          <div class="reveal-sky" aria-hidden="true"></div>
          <div class="reveal-copy">
            <p class="eyebrow">THE WORLD OF WORK</p>
            <h2>仕事も、働き方も、<br />ひとつじゃない。</h2>
            <p>いろんな仕事が、未来の扉へつながっている。</p>
          </div>
          <div class="reveal-door-scene" aria-hidden="true">
            <img class="reveal-door-art" src="assets/route-doors.webp" alt="" />
            <span class="reveal-door-glow reveal-door-glow--ssr"></span>
            <span class="reveal-door-glow reveal-door-glow--sr"></span>
            <span class="reveal-door-glow reveal-door-glow--r"></span>
            <span class="reveal-door-glow reveal-door-glow--n"></span>
            <span class="reveal-door-label reveal-door-label--ssr">SSR</span>
            <span class="reveal-door-label reveal-door-label--sr">SR</span>
            <span class="reveal-door-label reveal-door-label--r">R</span>
            <span class="reveal-door-label reveal-door-label--n">N</span>
          </div>
          <div id="revealCards" class="reveal-cards" aria-hidden="true"></div>
          <p class="reveal-caption">カードが、それぞれの未来の扉へ集まっていく。</p>
          <button class="reveal-skip" type="button" data-action="skip-reveal">スキップ</button>
        </section>
      </article>
    </template>

    <template id="goalTemplate">
      <article class="goal-screen">
        <div class="goal-heading">
          <p class="eyebrow">QUEST 01 / CHOOSE YOUR GATE</p>
          <h1>行きたい未来の<br />扉を選ぼう。</h1>
          <p class="supporting-copy">扉をタップすると、開くために必要な装備をうさぎが教えてくれるよ。</p>
          <p class="rank-note"><strong>扉のランク</strong>は、未経験から開くまでに必要な装備量の目安。あなた自身のランクではありません。</p>
        </div>

        <div class="door-map">
          <img src="assets/route-doors.webp" alt="四つの未来へつながる魔法の扉" />
          <button class="door-hotspot creative" data-goal="creative" aria-label="SSR クリエイティブの扉を確認する">
            <span class="door-rank">SSR</span><strong class="door-title">クリエイティブの扉</strong><small class="door-jobs">WEB・動画・制作</small>
          </button>
          <button class="door-hotspot it" data-goal="it" aria-label="SR IT・デジタルの扉を確認する">
            <span class="door-rank">SR</span><strong class="door-title">IT・デジタルの扉</strong><small class="door-jobs">インフラ・開発・CAD</small>
          </button>
          <button class="door-hotspot craft" data-goal="craft" aria-label="R ものづくりの扉を確認する">
            <span class="door-rank">R</span><strong class="door-title">ものづくりの扉</strong><small class="door-jobs">施工管理・機械</small>
          </button>
          <button class="door-hotspot people" data-goal="people" aria-label="N 人と仕事の扉を確認する">
            <span class="door-rank">N</span><strong class="door-title">人と仕事の扉</strong><small class="door-jobs">販売・接客・事務</small>
          </button>
        </div>

        <aside id="guideDialog" class="guide-dialog" hidden aria-live="polite">
          <button class="guide-close" data-action="close-guide" aria-label="案内を閉じる">×</button>
          <img src="assets/rabbit-guide.webp" alt="地図を持つ白うさぎの案内人" />
          <div class="guide-bubble">
            <p id="guideKicker" class="eyebrow">REQUIRED EQUIPMENT</p>
            <h2 id="guideTitle"></h2>
            <p id="guideCopy"></p>
            <ul id="guideEquipment"></ul>
            <button class="guide-button" data-action="choose-selected-goal">この扉を目指す <span>→</span></button>
          </div>
        </aside>
      </article>
    </template>

    <template id="questionTemplate">
      <article class="question-screen">
        <div class="progress" aria-label="進行状況"><span id="progressFill"></span></div>
        <p id="questionKicker" class="eyebrow"></p>
        <h1 id="questionTitle"></h1>
        <p id="questionHint" class="supporting-copy"></p>
        <div class="answer-stack">
          <button class="answer-button" data-answer="yes"></button>
          <button class="answer-button" data-answer="no"></button>
          <button class="answer-button subtle-answer" data-answer="maybe"></button>
        </div>
        <p class="microcopy">合否を決める質問ではないよ。今の自分に近いものを選ぼう。</p>
      </article>
    </template>

    <template id="resultTemplate">
      <article class="result-screen">
        <figure class="result-visual">
          <img id="resultArt" alt="診断されたスタートルート" />
          <p class="result-scroll-hint">↓ スクロールして、ルートを確認</p>
        </figure>

        <div class="result-copy">
          <p class="eyebrow">YOUR STARTING ROUTE</p>
          <p id="routeChip" class="route-chip"></p>
          <h1>行きたい未来へ進む、<br />今のスタートルート。</h1>
          <p id="resultLead" class="result-lead"></p>

          <section class="route-map" aria-label="キャリアルート">
            <div><span>選んだ未来の扉</span><strong id="goalName"></strong></div>
            <div><span>今のスタートルート</span><strong id="startingRoute"></strong></div>
            <div><span>最初に挑む仕事</span><strong id="nextJob"></strong></div>
          </section>

          <section class="first-quest">
            <p>FIRST QUEST</p>
            <strong id="firstQuest"></strong>
          </section>

          <p class="result-note">結果のランクは、今ある装備から始めやすいルートの目安です。職種の価値や、あなた自身の優劣を表すものではありません。</p>
          <button class="quest-button" data-action="restart">もう一度、ルートを確認する <span>↻</span></button>
          <p class="creator-credit">@satomi.ohtagaki</p>
        </div>
      </article>
    </template>

    <!-- Career Quest / @satomi.ohtagaki -->
    <script src="script.js"></script>
  </body>
</html>
