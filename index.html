<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#081827" />
    <meta name="description" content="行きたい未来と、今の自分から始めやすいキャリアルートを確認するミニゲームです。" />
    <meta name="author" content="@satomi.ohtagaki" />
    <meta name="copyright" content="© 2026 @satomi.ohtagaki" />
    <title>Career Quest | はじめのルートを探そう</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="is-locked">
    <section id="accessGate" class="access-gate" aria-labelledby="accessGateTitle">
      <div class="access-gate__shell">
        <img class="access-gate__art" src="assets/access-gate-screen.webp" alt="星空の神殿に立つ、金と青の閉ざされた冒険の扉" width="900" height="1599" fetchpriority="high" decoding="async" />

        <div class="access-gate__panel">
          <h1 id="accessGateTitle" class="sr-only">冒険の扉は閉ざされている</h1>
          <p class="sr-only">合言葉を入力してください</p>

          <form id="accessGateForm" class="access-gate__form" novalidate>
            <label class="sr-only" for="accessPassphrase">合言葉</label>
            <div class="access-gate__input-shell">
              <input id="accessPassphrase" name="passphrase" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" enterkeyhint="go" placeholder="合言葉を入力..." />
            </div>
            <p id="accessGateError" class="access-gate__error" role="alert" hidden>合言葉が違うようです。</p>
            <button type="submit" aria-label="扉をひらく"><span class="sr-only">扉をひらく</span></button>
          </form>
        </div>
      </div>
    </section>
    <main class="game-shell">
      <header class="game-bar">
        <span class="game-brand">CAREER QUEST</span>
        <span id="stepLabel" class="step-label" aria-live="polite">START</span>
        <nav id="gameNav" class="game-nav" aria-label="ページ操作" hidden>
          <button type="button" data-global-action="back" aria-label="一つ前に戻る">← 戻る</button>
          <button type="button" data-global-action="top" aria-label="トップへ戻る">TOP</button>
        </nav>
      </header>
      <section id="screen" class="screen" aria-live="polite"></section>
      <button id="persistentGuide" class="persistent-guide" type="button" aria-label="うさぎの案内人に話しかける">
        <img src="assets/rabbit-guide.webp" alt="" width="240" height="240" decoding="async" />
      </button>
    </main>

    <template id="startTemplate">
      <article class="start-screen">
        <img class="start-art" src="assets/hero.webp" alt="複数の未来の扉を前にした冒険者" fetchpriority="high" />
        <div class="start-action">
          <p>
            世の中には、まだ知らない仕事がたくさんある。<br />
            今すぐ開ける扉もあれば、<br />
            <strong>経験やスキルという装備</strong>を集めて開く扉もある。<br />
            今の自分から、未来へ続くルートを探そう。
          </p>
          <button class="quest-button" data-action="start-quest">キャリアクエストを始める <span>→</span></button>
        </div>
      </article>
    </template>

    <template id="goalTemplate">
      <article class="goal-screen">
        <section id="careerReveal" class="career-reveal" hidden aria-label="仕事のカードを動かして、未来の扉へ送る演出">
          <div class="reveal-veil" aria-hidden="true"></div>
          <div class="reveal-copy">
            <p class="eyebrow">THE WORLD OF WORK</p>
            <h2>仕事も、働き方も、ひとつじゃない。</h2>
          </div>
          <div id="cardLoading" class="card-loading" role="status">カードを準備中…🃏</div>
          <div id="revealCards" class="reveal-cards" aria-hidden="true"></div>
          <aside id="cardDetail" class="card-detail" hidden aria-live="polite">
            <button class="card-detail__close" type="button" data-action="close-card-detail" aria-label="カード詳細を閉じる">×</button>
            <button class="card-detail__nav card-detail__nav--prev" type="button" data-action="prev-card" aria-label="前のカードを見る">‹</button>
            <div class="card-detail__content">
              <div id="cardDetailVisual" class="card-detail__visual"></div>
              <dl class="card-detail__stats">
                <div><dt>役割</dt><dd id="cardDetailCopy"></dd></div>
                <div><dt>装備</dt><dd id="cardDetailGear"></dd></div>
                <div class="card-detail__warning"><dt>注意</dt><dd id="cardDetailChallenge"></dd></div>
              </dl>
              <button class="card-detail__choose" type="button" data-action="choose-card-gate">この扉を見てみる <span>→</span></button>
            </div>
            <button class="card-detail__nav card-detail__nav--next" type="button" data-action="next-card" aria-label="次のカードを見る">›</button>
          </aside>
          <aside id="dragGuide" class="reveal-drag-guide" role="status" aria-live="polite" hidden>
            <span class="reveal-drag-guide__icon" aria-hidden="true">↔</span>
            <p>気になる一枚をタップして、次のQUESTへ進もう！</p>
            <button class="reveal-drag-guide__close" type="button" data-action="close-drag-guide" aria-label="案内を閉じる">×</button>
          </aside>
          <div class="reveal-controls">
            <button class="reveal-skip" type="button" data-action="skip-reveal">演出をスキップして、カードを扉へ送る <span>→</span></button>
          </div>
        </section>

        <div class="goal-heading">
          <p class="eyebrow">QUEST 01 / CHOOSE YOUR GATE</p>
          <h1>行きたい未来の<br />扉を選ぼう。</h1>
          <p class="supporting-copy">扉をタップすると、開くために必要な装備をうさぎが教えてくれるよ。</p>
          <p class="rank-note"><strong>扉のランク</strong>は、今ある装備で挑みやすい扉の目安。経験値を集めれば、次の扉が開く。</p>
        </div>

        <div class="door-map">
          <img src="assets/route-doors.webp" alt="四つの未来へつながる魔法の扉" loading="lazy" decoding="async" />
          <button class="door-hotspot creative" data-goal="creative" aria-label="SSRの扉を確認する">
            <span class="door-rank">SSR</span><strong class="door-title">クリエイティブの扉</strong><small class="door-jobs">WEBデザイン・動画編集・プログラマー</small>
          </button>
          <button class="door-hotspot it" data-goal="it" aria-label="SRの扉を確認する">
            <span class="door-rank">SR</span><strong class="door-title">IT・デジタルの扉</strong><small class="door-jobs">インフラエンジニア・CADオペレーター・一般事務</small>
          </button>
          <button class="door-hotspot craft" data-goal="craft" aria-label="Rの扉を確認する">
            <span class="door-rank">R</span><strong class="door-title">ものづくりの扉</strong><small class="door-jobs">営業・施工管理・機械エンジニア</small>
          </button>
          <button class="door-hotspot people" data-goal="people" aria-label="Nの扉を確認する">
            <span class="door-rank">N</span><strong class="door-title">人と仕事の扉</strong><small class="door-jobs">販売・接客</small>
          </button>
        </div>

        <aside id="guideDialog" class="guide-dialog" hidden aria-live="polite">
          <button class="guide-close" data-action="close-guide" aria-label="案内を閉じる">×</button>
          <div class="guide-bubble">
            <p id="guideKicker" class="eyebrow">REQUIRED EQUIPMENT</p>
            <h2 id="guideTitle"></h2>
            <p id="guideCopy"></p>
            <ul id="guideEquipment"></ul>
            <button class="guide-button" data-action="choose-selected-goal">この扉を目指す <span>→</span></button>
          </div>
        </aside>
      </article>
    </template>

    <template id="questionTemplate">
      <article class="question-screen">
        <div class="progress" aria-label="進行状況"><span id="progressFill"></span></div>
        <p id="questionKicker" class="eyebrow"></p>
        <h1 id="questionTitle"></h1>
        <p id="questionHint" class="supporting-copy"></p>
        <div class="answer-stack">
          <button class="answer-button" data-answer="yes"></button>
          <button class="answer-button" data-answer="no"></button>
          <button class="answer-button subtle-answer" data-answer="maybe"></button>
        </div>
        <p class="microcopy">合否を決める質問ではないよ。今の自分に近いものを選ぼう。</p>
      </article>
    </template>

    <template id="resultTemplate">
      <article class="result-screen">
        <figure class="result-visual">
          <img id="resultArt" alt="診断されたスタートルート" loading="lazy" decoding="async" />
          <p class="result-scroll-hint">↓ スクロールして、ルートを確認</p>
        </figure>
        <div class="result-copy">
          <p class="eyebrow">YOUR STARTING ROUTE</p>
          <p id="routeChip" class="route-chip"></p>
          <h1>行きたい未来へ進む、<br />今のスタートルート。</h1>
          <p id="resultLead" class="result-lead"></p>
          <section class="route-map" aria-label="キャリアルート">
            <div><span>選んだ未来の扉</span><strong id="goalName"></strong></div>
            <div><span>今のスタートルート</span><strong id="startingRoute"></strong></div>
            <div><span>このルートで選べるジョブ</span><strong id="nextJob"></strong></div>
          </section>
          <section class="first-quest">
            <p>FIRST QUEST</p>
            <strong id="firstQuest"></strong>
          </section>
          <p class="result-note">今の装備で始められるルートが、次の扉へ進むための経験値になる。</p>
          <button class="quest-button" data-action="restart">もう一度、ルートを確認する <span>↻</span></button>
          <p class="creator-credit">@satomi.ohtagaki</p>
        </div>

        <aside id="resultQuestNotice" class="result-quest-notice" role="dialog" aria-modal="true" aria-labelledby="resultQuestTitle" hidden>
          <div class="result-quest-notice__panel">
            <div class="result-quest-notice__ornaments" aria-hidden="true">
              <span class="result-quest-notice__corner result-quest-notice__corner--tl"></span>
              <span class="result-quest-notice__corner result-quest-notice__corner--tr"></span>
              <span class="result-quest-notice__corner result-quest-notice__corner--bl"></span>
              <span class="result-quest-notice__corner result-quest-notice__corner--br"></span>
              <span class="result-quest-notice__crest result-quest-notice__crest--top"></span>
              <span class="result-quest-notice__crest result-quest-notice__crest--bottom"></span>
            </div>
            <button class="result-quest-notice__close" type="button" data-action="close-result-quest" aria-label="クエスト案内を閉じる">×</button>
            <span class="result-quest-notice__spark" aria-hidden="true">✦</span>
            <p id="resultQuestTitle" class="result-quest-notice__title">QUEST発生！</p>
            <p class="result-quest-notice__copy">次に進むルートを<br />担当者と一緒に考えよう！</p>
            <button class="result-quest-notice__button" type="button" data-action="confirm-result-quest">
              担当者と進み方を確認する <span>›</span>
            </button>
          </div>
        </aside>
      </article>
    </template>

    <script src="script.js"></script>
  </body>
</html>
