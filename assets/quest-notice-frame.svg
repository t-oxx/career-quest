<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="none">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a5715"/>
      <stop offset="0.18" stop-color="#fff1ae"/>
      <stop offset="0.42" stop-color="#c78b25"/>
      <stop offset="0.67" stop-color="#ffe8a0"/>
      <stop offset="1" stop-color="#784510"/>
    </linearGradient>
    <linearGradient id="goldBright" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7c8"/>
      <stop offset="0.35" stop-color="#f5c95c"/>
      <stop offset="0.7" stop-color="#a76c18"/>
      <stop offset="1" stop-color="#ffeba3"/>
    </linearGradient>
    <radialGradient id="gem" cx="38%" cy="28%" r="72%">
      <stop offset="0" stop-color="#eafaff"/>
      <stop offset="0.2" stop-color="#63cff7"/>
      <stop offset="0.58" stop-color="#1765a3"/>
      <stop offset="1" stop-color="#052e58"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Main double frame -->
  <rect x="18" y="18" width="1164" height="764" rx="48" fill="none" stroke="#4a2a08" stroke-width="26" opacity=".95"/>
  <rect x="22" y="22" width="1156" height="756" rx="45" fill="none" stroke="url(#gold)" stroke-width="14"/>
  <rect x="45" y="45" width="1110" height="710" rx="34" fill="none" stroke="#ffe7a0" stroke-width="3" opacity=".92"/>
  <rect x="58" y="58" width="1084" height="684" rx="28" fill="none" stroke="#9ecff0" stroke-width="2" opacity=".34"/>

  <!-- Decorative side rails -->
  <path d="M110 78 H430 M770 78 H1090 M110 722 H430 M770 722 H1090" fill="none" stroke="url(#goldBright)" stroke-width="6" stroke-linecap="round"/>
  <path d="M86 150 V650 M1114 150 V650" fill="none" stroke="url(#gold)" stroke-width="5" opacity=".9"/>
  <g fill="#f8d77f" opacity=".95">
    <circle cx="86" cy="225" r="7"/><circle cx="86" cy="400" r="7"/><circle cx="86" cy="575" r="7"/>
    <circle cx="1114" cy="225" r="7"/><circle cx="1114" cy="400" r="7"/><circle cx="1114" cy="575" r="7"/>
  </g>

  <!-- Corner filigree -->
  <g fill="none" stroke="url(#goldBright)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)">
    <path d="M50 160 C60 84 105 52 177 49 C120 74 96 103 92 153 C91 118 73 95 47 84 C82 89 104 112 110 145 C119 103 146 79 194 69"/>
    <path d="M1150 160 C1140 84 1095 52 1023 49 C1080 74 1104 103 1108 153 C1109 118 1127 95 1153 84 C1118 89 1096 112 1090 145 C1081 103 1054 79 1006 69"/>
    <path d="M50 640 C60 716 105 748 177 751 C120 726 96 697 92 647 C91 682 73 705 47 716 C82 711 104 688 110 655 C119 697 146 721 194 731"/>
    <path d="M1150 640 C1140 716 1095 748 1023 751 C1080 726 1104 697 1108 647 C1109 682 1127 705 1153 716 C1118 711 1096 688 1090 655 C1081 697 1054 721 1006 731"/>
  </g>
  <g fill="url(#goldBright)">
    <path d="M66 66 l25 -7 7 -25 7 25 25 7-25 7-7 25-7-25z"/>
    <path d="M1134 66 l-25 -7-7 -25-7 25-25 7 25 7 7 25 7-25z"/>
    <path d="M66 734 l25 7 7 25 7-25 25-7-25-7-7-25-7 25z"/>
    <path d="M1134 734 l-25 7-7 25-7-25-25-7 25-7 7-25 7 25z"/>
  </g>

  <!-- Top crest -->
  <g transform="translate(600 48)" filter="url(#glow)">
    <path d="M-172 8 C-118 -12 -88 -15 -58 -2 C-96 -1 -116 11 -132 30 C-103 17 -81 17 -58 25" fill="none" stroke="url(#goldBright)" stroke-width="8" stroke-linecap="round"/>
    <path d="M172 8 C118 -12 88 -15 58 -2 C96 -1 116 11 132 30 C103 17 81 17 58 25" fill="none" stroke="url(#goldBright)" stroke-width="8" stroke-linecap="round"/>
    <path d="M0 -31 L48 8 L0 57 L-48 8 Z" fill="#082f50" stroke="#6e3f0c" stroke-width="14"/>
    <path d="M0 -25 L40 8 L0 49 L-40 8 Z" fill="url(#gem)" stroke="url(#goldBright)" stroke-width="7"/>
    <path d="M0 -14 L25 8 L0 35 L-25 8 Z" fill="none" stroke="#bcefff" stroke-width="3" opacity=".8"/>
    <path d="M0 -2 L10 8 L0 20 L-10 8 Z" fill="#e9fbff" opacity=".85"/>
  </g>

  <!-- Bottom crest -->
  <g transform="translate(600 750)" filter="url(#softGlow)">
    <path d="M-130 -6 C-90 12 -62 14 -35 2 M130 -6 C90 12 62 14 35 2" fill="none" stroke="url(#goldBright)" stroke-width="7" stroke-linecap="round"/>
    <path d="M0 -26 L34 0 L0 29 L-34 0 Z" fill="#0a3657" stroke="#75450f" stroke-width="11"/>
    <path d="M0 -21 L28 0 L0 24 L-28 0 Z" fill="url(#gem)" stroke="url(#goldBright)" stroke-width="6"/>
  </g>

  <!-- Tiny sparkle studs -->
  <g fill="#fff2b2" filter="url(#softGlow)">
    <path d="M245 44 l6 14 14 6-14 6-6 14-6-14-14-6 14-6z"/>
    <path d="M955 44 l6 14 14 6-14 6-6 14-6-14-14-6 14-6z"/>
    <path d="M245 756 l6-14 14-6-14-6-6-14-6 14-14 6 14 6z"/>
    <path d="M955 756 l6-14 14-6-14-6-6-14-6 14-14 6 14 6z"/>
  </g>
</svg>
